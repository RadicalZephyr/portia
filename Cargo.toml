[workspace]
resolver = "3"
members = ["portia", "portia-derive", "portia-oracle", "portia-bench"]

[workspace.package]
version = "0.0.1"
authors = ["Zefira Shannon"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/portia-rs/portia"

[workspace.dependencies]
portia = { path = "portia", version = "0.0.1" }
portia-derive = { path = "portia-derive", version = "0.0.1" }
portia-oracle = { path = "portia-oracle", version = "0.0.1" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
proptest = { version = "1", default-features = false, features = ["std"] }
critical-section = "1"
criterion = "0.5"
gungraun = "=0.19.4"
