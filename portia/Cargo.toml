[package]
name = "portia"
description = "Compose your Rust functions and data into a program that reacts to events, with each event's updates applied together and in order."
readme = "../README.md"
keywords = ["frp", "reactive", "events", "dataflow", "sodium"]
categories = ["data-structures", "rust-patterns", "no-std", "embedded"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
# The standard library: the thread-id guard on `RemoteIo`, `Trace` for the
# standard collections and `Instant`, and the standard mutex under input
# slots. Off for bare metal; a web build keeps it.
std = []
# Guards input slots on bare metal with the critical section every HAL
# implements. The default feature set has no runtime dependency.
critical-section = ["dep:critical-section"]
# Re-exports `#[derive(Trace)]` from `portia-derive`.
derive = ["dep:portia-derive"]
# Per-transaction phase counters for attributing a regression to a phase.
statistics = []
# Spike scaffolding, not API: `portia::smoke` builds and drives a graph with
# every node kind the engine has so far, so that a library build for a
# bare-metal target pushes the generic engine through code generation.
smoke = []

[package.metadata.docs.rs]
# The crate root tells users to derive `Trace`, so docs.rs shows the derive.
features = ["derive"]

[dependencies]
portia-derive = { workspace = true, optional = true }
critical-section = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
